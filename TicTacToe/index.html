<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <main>
        <div class="game-message hide">Winner</div>
        <h1>Tic Tac Toe</h1>

        <div class = "container">
            <button class="startbtn">Start game</button>
            <div class="game">
                <button class="btn tic-btn" id="1-1"></button>
                <button class="btn tic-btn" id="1-2"></button>
                <button class="btn tic-btn" id="1-3"></button>
                <button class="btn tic-btn" id="2-1"></button>
                <button class="btn tic-btn" id="2-2"></button>
                <button class="btn tic-btn" id="2-3"></button>
                <button class="btn tic-btn" id="3-1"></button>
                <button class="btn tic-btn" id="3-2"></button>
                <button class="btn tic-btn" id="3-3"></button>
            </div>

            <button class="resetbtn">Reset game</button>
        </div>

    </main>

<script src="script.js"></script>
</body>
</html>
